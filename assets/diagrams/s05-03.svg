<svg xmlns="http://www.w3.org/2000/svg" id="diagram-s05-03" width="744" class="flowchart" height="339" viewBox="4 4 744 339" role="img" aria-labelledby="title-s05-03 desc-s05-03" style="max-width: none; background-color: rgb(255, 255, 255);"><title id="title-s05-03">Configuration does not define the entire access boundary</title><desc id="desc-s05-03">Configuration selects a server definition. Identity determines its account access; exposed tools determine possible operations; the current user task determines what is authorized now. The permitted action is the intersection, not the union, of those limits.</desc><style>#diagram-s05-03{font-family:Segoe UI,Arial,sans-serif;font-size:16px;fill:#242331;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#diagram-s05-03 .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#diagram-s05-03 .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#diagram-s05-03 .error-icon{fill:#f7f8fb;}#diagram-s05-03 .error-text{fill:#080704;stroke:#080704;}#diagram-s05-03 .edge-thickness-normal{stroke-width:1px;}#diagram-s05-03 .edge-thickness-thick{stroke-width:3.5px;}#diagram-s05-03 .edge-pattern-solid{stroke-dasharray:0;}#diagram-s05-03 .edge-thickness-invisible{stroke-width:0;fill:none;}#diagram-s05-03 .edge-pattern-dashed{stroke-dasharray:3;}#diagram-s05-03 .edge-pattern-dotted{stroke-dasharray:2;}#diagram-s05-03 .marker{fill:#645d76;stroke:#645d76;}#diagram-s05-03 .marker.cross{stroke:#645d76;}#diagram-s05-03 svg{font-family:Segoe UI,Arial,sans-serif;font-size:16px;}#diagram-s05-03 p{margin:0;}#diagram-s05-03 .label{font-family:Segoe UI,Arial,sans-serif;color:#242331;}#diagram-s05-03 .cluster-label text{fill:#080704;}#diagram-s05-03 .cluster-label span{color:#080704;}#diagram-s05-03 .cluster-label span p{background-color:transparent;