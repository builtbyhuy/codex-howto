<svg xmlns="http://www.w3.org/2000/svg" width="288" height="310" viewBox="0 0 288 310" role="img" aria-labelledby="title-s03-05-mobile desc-s03-05-mobile" font-family="Segoe UI, Arial, sans-serif"><title id="title-s03-05-mobile">Delegated skill use needs a returned artifact and evidence</title><desc id="desc-s03-05-mobile">The parent defines a bounded task and relevant skill. The child performs its task within inherited limits and returns evidence. The parent checks the result before synthesis; mentioning a skill does not prove the child actually used it.</desc><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#8a7ba4" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="288" height="310" fill="#ffffff"/><path d="M14,20 L14,230" fill="none" stroke="#8a7ba4" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 4"/><circle cx="14" cy="19" r="5" fill="#7256b2"/><text x="29" y="23" font-size="14" font-weight="600" text-anchor="start" fill="#7256b2"><tspan x="29" dy="0">Parent → Worker</tspan></text><text x="29" y="45" font-size="15" font-weight="500" text-anchor="start" fill="#302c3f"><tspan x="29" dy="0">Scope + relevant skill</tspan></text><circle cx="14" cy="76" r="5" fill="#7256b2"/><text x="29" y="80" font-size="14" font-weight="600" text-anchor="start" fill="#7256b2"><tspan x="29" dy="0">Worker → Checks</tspan></text><text x="29" y="102" font-size="15" font-weight="500" text-anchor="start" fill="#302c3f"><tspan x="29" dy="0">Test resulting artifact</tspan></text><circle cx="14" cy="133" r="5" fill="#7256b2"/><text x="29" y="137" font-size="14" font-weight="600" text-anchor="start" fill="#7256b2"><tspan x="29" dy="0">Checks → Worker</tspan></text><text x="29" y="159" font-size="15" font-weight="500" text-anchor="start" fill="#302c3f"><tspan x="29" dy="0">Output + evidence</tspan></text><circle cx="14" cy="190" r="5" fill="#7256b2"/><text x="29" y="194" font-size="14" font-weight="600" text-anchor="start" fill="#7256b2"><tspan x="29" dy="0">Worker → Parent</tspan></text><text x="29" y="216" font-size="15" font-weight="500" text-anchor="start" fill="#302c3f"><tspan x="29" dy="0">Artifact + evidence</tspan></text><text x="144" y="268" font-size="14" font-weight="400" text-anchor="middle" fill="#5e586f"><tspan x="144" dy="0">The parent verifies the handoff</tspan><tspan x="144" dy="20">before accepting the result.</tspan></text></svg>
