<svg xmlns="http://www.w3.org/2000/svg" width="624" height="308" viewBox="0 0 624 308" role="img" aria-labelledby="title-s04-06 desc-s04-06" font-family="Segoe UI, Arial, sans-serif"><title id="title-s04-06">Separate contexts and separate file trees solve different conflicts</title><desc id="desc-s04-06">Two agent contexts do not by themselves isolate files. Independent worktrees start from a chosen baseline, keep changes apart, and require checks and integration before the final result is accepted.</desc><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#8a7ba4" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="624" height="308" fill="#ffffff"/><g class="overview-node" data-x="122" data-y="8" data-width="380" data-height="52"><rect x="122" y="8" width="380" height="52" rx="9" fill="#f5f1fc" stroke="#a68dcf" stroke-width="1.2"/><text x="312" y="39" font-size="15" font-weight="600" text-anchor="middle" fill="#302c3f"><tspan x="312" dy="0">Known Git baseline</tspan></text></g><path d="M312,60 L312,80 L140,80 L140,98" fill="none" stroke="#8a7ba4" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M312,80 L484,80 L484,98" fill="none" stroke="#8a7ba4" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M140,164 L140,185 L312,185 L312,200" fill="none" stroke="#8a7ba4" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M484,164 L484,185 L312,185" fill="none" stroke="#8a7ba4" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><g class="overview-node" data-x="8" data-y="100" data-width="264" data-height="64"><rect x="8" y="100" width="264" height="64" rx="9" fill="#ffffff" stroke="#d3ccdf" stroke-width="1.2"/><text x="140" y="137" font-size="15" font-weight="500" text-anchor="middle" fill="#302c3f"><tspan x="140" dy="0">Worktree A + worker</tspan></text></g><g class="overview-node" data-x="352" data-y="100" data-width="264" data-height="64"><rect x="352" y="100" width="264" height="64" rx="9" fill="#ffffff" stroke="#d3ccdf" stroke-width="1.2"/><text x="484" y="137" font-size="15" font-weight="500" text-anchor="middle" fill="#302c3f"><tspan x="484" dy="0">Worktree B + worker</tspan></text></g><g class="overview-node" data-x="108" data-y="202" data-width="408" data-height="58"><rect x="108" y="202" width="408" height="58" rx="9" fill="#f5f1fc" stroke="#a68dcf" stroke-width="1.2"/><text x="312" y="236" font-size="15" font-weight="600" text-anchor="middle" fill="#302c3f"><tspan x="312" dy="0">Integrate changes + rerun checks</tspan></text></g><text x="312" y="286" font-size="14" font-weight="400" text-anchor="middle" fill="#5e586f"><tspan x="312" dy="0">Separate agent contexts do not isolate shared files.</tspan></text></svg>
