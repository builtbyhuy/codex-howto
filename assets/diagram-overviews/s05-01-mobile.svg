<svg xmlns="http://www.w3.org/2000/svg" width="288" height="310" viewBox="0 0 288 310" role="img" aria-labelledby="title-s05-01-mobile desc-s05-01-mobile" font-family="Segoe UI, Arial, sans-serif"><title id="title-s05-01-mobile">The MCP server supplies tools; the client decides how to use them</title><desc id="desc-s05-01-mobile">Codex discovers a server&apos;s capabilities, calls a tool for the bounded user task, and receives a structured result or error. The server&apos;s source data and the client&apos;s final answer are separate stages that both need checking.</desc><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#8a7ba4" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="288" height="310" fill="#ffffff"/><path d="M14,20 L14,230" fill="none" stroke="#8a7ba4" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 4"/><circle cx="14" cy="19" r="5" fill="#7256b2"/><text x="29" y="23" font-size="14" font-weight="600" text-anchor="start" fill="#7256b2"><tspan x="29" dy="0">Codex → MCP server</tspan></text><text x="29" y="45" font-size="15" font-weight="500" text-anchor="start" fill="#302c3f"><tspan x="29" dy="0">Discover capabilities</tspan></text><circle cx="14" cy="76" r="5" fill="#7256b2"/><text x="29" y="80" font-size="14" font-weight="600" text-anchor="start" fill="#7256b2"><tspan x="29" dy="0">Codex → MCP server</tspan></text><text x="29" y="102" font-size="15" font-weight="500" text-anchor="start" fill="#302c3f"><tspan x="29" dy="0">Call a bounded tool</tspan></text><circle cx="14" cy="133" r="5" fill="#7256b2"/><text x="29" y="137" font-size="14" font-weight="600" text-anchor="start" fill="#7256b2"><tspan x="29" dy="0">MCP server → Source</tspan></text><text x="29" y="159" font-size="15" font-weight="500" text-anchor="start" fill="#302c3f"><tspan x="29" dy="0">Read permitted data</tspan></text><circle cx="14" cy="190" r="5" fill="#7256b2"/><text x="29" y="194" font-size="14" font-weight="600" text-anchor="start" fill="#7256b2"><tspan x="29" dy="0">MCP server → Codex</tspan></text><text x="29" y="216" font-size="15" font-weight="500" text-anchor="start" fill="#302c3f"><tspan x="29" dy="0">Source result or error</tspan></text><text x="144" y="268" font-size="14" font-weight="400" text-anchor="middle" fill="#5e586f"><tspan x="144" dy="0">Check source evidence before writing</tspan><tspan x="144" dy="20">the final answer.</tspan></text></svg>
