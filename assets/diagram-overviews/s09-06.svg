<svg xmlns="http://www.w3.org/2000/svg" width="624" height="236" viewBox="0 0 624 236" role="img" aria-labelledby="title-s09-06 desc-s09-06" font-family="Segoe UI, Arial, sans-serif"><title id="title-s09-06">Effective access is constrained by several boundaries</title><desc id="desc-s09-06">Filesystem scope, network access, approval policy, and organization controls jointly constrain execution. Changing a setting label does not prove broader access or success. The task&apos;s own authorization remains an additional limit.</desc><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#8a7ba4" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="624" height="236" fill="#ffffff"/><g class="overview-node" data-x="8" data-y="8" data-width="184" data-height="66"><rect x="8" y="8" width="184" height="66" rx="9" fill="#ffffff" stroke="#d3ccdf" stroke-width="1.2"/><text x="100" y="35.5" font-size="15" font-weight="500" text-anchor="middle" fill="#302c3f"><tspan x="100" dy="0">Files + network</tspan><tspan x="100" dy="21">scope</tspan></text></g><path d="M100,74 L100,100 L312,100" fill="none" stroke="#8a7ba4" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><g class="overview-node" data-x="220" data-y="8" data-width="184" data-height="66"><rect x="220" y="8" width="184" height="66" rx="9" fill="#ffffff" stroke="#d3ccdf" stroke-width="1.2"/><text x="312" y="35.5" font-size="15" font-weight="500" text-anchor="middle" fill="#302c3f"><tspan x="312" dy="0">Approval + org</tspan><tspan x="312" dy="21">controls</tspan></text></g><path d="M312,74 L312,100 L312,100" fill="none" stroke="#8a7ba4" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><g class="overview-node" data-x="432" data-y="8" data-width="184" data-height="66"><rect x="432" y="8" width="184" height="66" rx="9" fill="#ffffff" stroke="#d3ccdf" stroke-width="1.2"/><text x="524" y="46" font-size="15" font-weight="500" text-anchor="middle" fill="#302c3f"><tspan x="524" dy="0">Task authorization</tspan></text></g><path d="M524,74 L524,100 L312,100" fill="none" stroke="#8a7ba4" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M312,100 L312,128" fill="none" stroke="#8a7ba4" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><g class="overview-node" data-x="126" data-y="130" data-width="372" data-height="58"><rect x="126" y="130" width="372" height="58" rx="9" fill="#f5f1fc" stroke="#a68dcf" stroke-width="1.2"/><text x="312" y="164" font-size="15" font-weight="600" text-anchor="middle" fill="#302c3f"><tspan x="312" dy="0">Effective allowed operation</tspan></text></g><text x="312" y="219" font-size="14" font-weight="400" text-anchor="middle" fill="#5e586f"><tspan x="312" dy="0">A setting label does not prove access; inspect actual behavior.</tspan></text></svg>
