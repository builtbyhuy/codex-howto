<svg xmlns="http://www.w3.org/2000/svg" width="288" height="288" viewBox="0 0 288 288" role="img" aria-labelledby="title-s09-05-mobile desc-s09-05-mobile" font-family="Segoe UI, Arial, sans-serif"><title id="title-s09-05-mobile">Create a recurring task, inspect a real run, then manage its state</title><desc id="desc-s09-05-mobile">Prove the prompt manually, then use Scheduled to choose the project, prompt, cadence, time zone and environment. After saving the intended task, inspect its actual first run. Edit or pause it as needed; removal must be confirmed by its inactive state. Local execution needs the configured computer, app and project to remain available.</desc><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#8a7ba4" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="288" height="288" fill="#ffffff"/><path d="M136,55 L150,55" fill="none" stroke="#8a7ba4" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M216,94 L216,130" fill="none" stroke="#8a7ba4" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M152,171 L138,171" fill="none" stroke="#8a7ba4" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M8,171 L2,171 L2,55 L6,55" fill="none" stroke="#8a7ba4" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 4" marker-end="url(#arrow)"/><g class="overview-node" data-x="8" data-y="16" data-width="128" data-height="78"><rect x="8" y="16" width="128" height="78" rx="9" fill="#f5f1fc" stroke="#a68dcf" stroke-width="1.2"/><text x="72" y="49.5" font-size="15" font-weight="600" text-anchor="middle" fill="#302c3f"><tspan x="72" dy="0">Verify a manual</tspan><tspan x="72" dy="21">task</tspan></text></g><g class="overview-node" data-x="152" data-y="16" data-width="128" data-height="78"><rect x="152" y="16" width="128" height="78" rx="9" fill="#ffffff" stroke="#d3ccdf" stroke-width="1.2"/><text x="216" y="49.5" font-size="15" font-weight="500" text-anchor="middle" fill="#302c3f"><tspan x="216" dy="0">Set project +</tspan><tspan x="216" dy="21">cadence</tspan></text></g><g class="overview-node" data-x="152" data-y="132" data-width="128" data-height="78"><rect x="152" y="132" width="128" height="78" rx="9" fill="#ffffff" stroke="#d3ccdf" stroke-width="1.2"/><text x="216" y="165.5" font-size="15" font-weight="500" text-anchor="middle" fill="#302c3f"><tspan x="216" dy="0">Save in</tspan><tspan x="216" dy="21">Scheduled</tspan></text></g><g class="overview-node" data-x="8" data-y="132" data-width="128" data-height="78"><rect x="8" y="132" width="128" height="78" rx="9" fill="#ffffff" stroke="#d3ccdf" stroke-width="1.2"/><text x="72" y="165.5" font-size="15" font-weight="500" text-anchor="middle" fill="#302c3f"><tspan x="72" dy="0">Inspect run;</tspan><tspan x="72" dy="21">edit or pause</tspan></text></g><text x="144" y="237" font-size="14" font-weight="400" text-anchor="middle" fill="#5e586f"><tspan x="144" dy="0">For local runs, the computer, app</tspan><tspan x="144" dy="20">and project must be available.</tspan></text></svg>
