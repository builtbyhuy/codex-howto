<svg xmlns="http://www.w3.org/2000/svg" width="288" height="250" viewBox="0 0 288 250" role="img" aria-labelledby="title-s06-03-mobile desc-s06-03-mobile" font-family="Segoe UI, Arial, sans-serif"><title id="title-s06-03-mobile">Choose between a local command and an existing MCP tool</title><desc id="desc-s06-03-mobile">A deterministic local check can use a command handler. A check that needs an already connected capability may use a supported MCP tool handler. These are alternatives. Both need explicit failure tests, and a preventive gate needs a synchronous supported decision path.</desc><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#8a7ba4" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="288" height="250" fill="#ffffff"/><g class="overview-node" data-x="8" data-y="8" data-width="112" data-height="72"><rect x="8" y="8" width="112" height="72" rx="9" fill="#f5f1fc" stroke="#a68dcf" stroke-width="1.2"/><text x="64" y="49" font-size="15" font-weight="600" text-anchor="middle" fill="#302c3f"><tspan x="64" dy="0">Local check</tspan></text></g><path d="M120,44 L144,44" fill="none" stroke="#8a7ba4" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><g class="overview-node" data-x="146" data-y="8" data-width="134" data-height="72"><rect x="146" y="8" width="134" height="72" rx="9" fill="#ffffff" stroke="#d3ccdf" stroke-width="1.2"/><text x="213" y="38.5" font-size="15" font-weight="500" text-anchor="middle" fill="#302c3f"><tspan x="213" dy="0">Command</tspan><tspan x="213" dy="21">handler</tspan></text></g><g class="overview-node" data-x="8" data-y="89" data-width="112" data-height="72"><rect x="8" y="89" width="112" height="72" rx="9" fill="#f5f1fc" stroke="#a68dcf" stroke-width="1.2"/><text x="64" y="119.5" font-size="15" font-weight="600" text-anchor="middle" fill="#302c3f"><tspan x="64" dy="0">Connected</tspan><tspan x="64" dy="21">capability</tspan></text></g><path d="M120,125 L144,125" fill="none" stroke="#8a7ba4" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><g class="overview-node" data-x="146" data-y="89" data-width="134" data-height="72"><rect x="146" y="89" width="134" height="72" rx="9" fill="#ffffff" stroke="#d3ccdf" stroke-width="1.2"/><text x="213" y="109" font-size="15" font-weight="500" text-anchor="middle" fill="#302c3f"><tspan x="213" dy="0">Supported</tspan><tspan x="213" dy="21">MCP-tool</tspan><tspan x="213" dy="21">handler</tspan></text></g><text x="144" y="212" font-size="14" font-weight="400" text-anchor="middle" fill="#5e586f"><tspan x="144" dy="0">Preventive gate: test a supported</tspan><tspan x="144" dy="20">synchronous decision.</tspan></text></svg>
