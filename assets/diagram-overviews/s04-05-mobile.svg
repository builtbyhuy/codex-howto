<svg xmlns="http://www.w3.org/2000/svg" width="288" height="306" viewBox="0 0 288 306" role="img" aria-labelledby="title-s04-05-mobile desc-s04-05-mobile" font-family="Segoe UI, Arial, sans-serif"><title id="title-s04-05-mobile">Background work keeps its identity until authoritative completion</title><desc id="desc-s04-05-mobile">A dispatched task is running or waiting until its real handle reports completion, failure, or required input. A polling timeout is a reason to inspect or wait again, not evidence that a duplicate task should be started.</desc><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#8a7ba4" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="288" height="306" fill="#ffffff"/><path d="M164,56 L164,68 L20,68 L20,214" fill="none" stroke="#8a7ba4" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M20,98 L42,98" fill="none" stroke="#8a7ba4" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M20,156 L42,156" fill="none" stroke="#8a7ba4" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M20,214 L42,214" fill="none" stroke="#8a7ba4" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><g class="overview-node" data-x="44" data-y="8" data-width="236" data-height="48"><rect x="44" y="8" width="236" height="48" rx="24" fill="#f5f1fc" stroke="#a68dcf" stroke-width="1.2"/><text x="162" y="37" font-size="15" font-weight="600" text-anchor="middle" fill="#302c3f"><tspan x="162" dy="0">Running / waiting</tspan></text></g><g class="overview-node" data-x="44" data-y="76" data-width="236" data-height="44"><rect x="44" y="76" width="236" height="44" rx="22" fill="#ffffff" stroke="#d3ccdf" stroke-width="1.2"/><text x="162" y="103" font-size="15" font-weight="500" text-anchor="middle" fill="#302c3f"><tspan x="162" dy="0">Complete → verify</tspan></text></g><g class="overview-node" data-x="44" data-y="134" data-width="236" data-height="44"><rect x="44" y="134" width="236" height="44" rx="22" fill="#ffffff" stroke="#d3ccdf" stroke-width="1.2"/><text x="162" y="161" font-size="15" font-weight="500" text-anchor="middle" fill="#302c3f"><tspan x="162" dy="0">Failed → diagnose</tspan></text></g><g class="overview-node" data-x="44" data-y="192" data-width="236" data-height="44"><rect x="44" y="192" width="236" height="44" rx="22" fill="#ffffff" stroke="#d3ccdf" stroke-width="1.2"/><text x="162" y="219" font-size="15" font-weight="500" text-anchor="middle" fill="#302c3f"><tspan x="162" dy="0">Needs input → handoff</tspan></text></g><text x="144" y="266" font-size="14" font-weight="400" text-anchor="middle" fill="#5e586f"><tspan x="144" dy="0">A poll timeout keeps the same task</tspan><tspan x="144" dy="20">identity; do not duplicate.</tspan></text></svg>
