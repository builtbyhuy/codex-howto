<svg xmlns="http://www.w3.org/2000/svg" width="624" height="306" viewBox="0 0 624 306" role="img" aria-labelledby="title-s03-05 desc-s03-05" font-family="Segoe UI, Arial, sans-serif"><title id="title-s03-05">Delegated skill use needs a returned artifact and evidence</title><desc id="desc-s03-05">The parent defines a bounded task and relevant skill. The child performs its task within inherited limits and returns evidence. The parent checks the result before synthesis; mentioning a skill does not prove the child actually used it.</desc><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#8a7ba4" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="624" height="306" fill="#ffffff"/><g class="overview-node" data-x="12" data-y="8" data-width="184" data-height="44"><rect x="12" y="8" width="184" height="44" rx="9" fill="#f5f1fc" stroke="#a68dcf" stroke-width="1.2"/><text x="104" y="35" font-size="15" font-weight="600" text-anchor="middle" fill="#302c3f"><tspan x="104" dy="0">Parent</tspan></text></g><path d="M104,52 L104,246" fill="none" stroke="#8a7ba4" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 4"/><g class="overview-node" data-x="220" data-y="8" data-width="184" data-height="44"><rect x="220" y="8" width="184" height="44" rx="9" fill="#f5f1fc" stroke="#a68dcf" stroke-width="1.2"/><text x="312" y="35" font-size="15" font-weight="600" text-anchor="middle" fill="#302c3f"><tspan x="312" dy="0">Worker</tspan></text></g><path d="M312,52 L312,246" fill="none" stroke="#8a7ba4" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 4"/><g class="overview-node" data-x="428" data-y="8" data-width="184" data-height="44"><rect x="428" y="8" width="184" height="44" rx="9" fill="#f5f1fc" stroke="#a68dcf" stroke-width="1.2"/><text x="520" y="35" font-size="15" font-weight="600" text-anchor="middle" fill="#302c3f"><tspan x="520" dy="0">Checks</tspan></text></g><path d="M520,52 L520,246" fill="none" stroke="#8a7ba4" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 4"/><path d="M104,91 L309,91" fill="none" stroke="#8a7ba4" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="115.3" y="57" width="185.4" height="22" rx="3" fill="#ffffff"/><text x="208" y="77" font-size="14" font-weight="500" text-anchor="middle" fill="#302c3f"><tspan x="208" dy="0">Scope + relevant skill</tspan></text><path d="M312,136 L517,136" fill="none" stroke="#8a7ba4" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="319.45" y="102" width="193.1" height="22" rx="3" fill="#ffffff"/><text x="416" y="122" font-size="14" font-weight="500" text-anchor="middle" fill="#302c3f"><tspan x="416" dy="0">Test resulting artifact</tspan></text><path d="M520,181 L315,181" fill="none" stroke="#8a7ba4" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="342.55" y="147" width="146.9" height="22" rx="3" fill="#ffffff"/><text x="416" y="167" font-size="14" font-weight="500" text-anchor="middle" fill="#302c3f"><tspan x="416" dy="0">Output + evidence</tspan></text><path d="M312,226 L107,226" fill="none" stroke="#8a7ba4" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="126.85" y="192" width="162.3" height="22" rx="3" fill="#ffffff"/><text x="208" y="212" font-size="14" font-weight="500" text-anchor="middle" fill="#302c3f"><tspan x="208" dy="0">Artifact + evidence</tspan></text><text x="312" y="282" font-size="14" font-weight="400" text-anchor="middle" fill="#5e586f"><tspan x="312" dy="0">The parent verifies the handoff before accepting the result.</tspan></text></svg>
