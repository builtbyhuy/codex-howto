<svg xmlns="http://www.w3.org/2000/svg" width="288" height="310" viewBox="0 0 288 310" role="img" aria-labelledby="title-s10-04-mobile desc-s10-04-mobile" font-family="Segoe UI, Arial, sans-serif"><title id="title-s10-04-mobile">Consume events and final output without confusing them</title><desc id="desc-s10-04-mobile">The parent starts the CLI and passes captured JSONL plus the actual child exit or signal to the report consumer. The final-answer artifact is separate. A report is accepted only when process outcome, terminal event and report data all pass; malformed, incomplete and failed runs return distinct non-zero outcomes.</desc><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#8a7ba4" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="288" height="310" fill="#ffffff"/><path d="M14,20 L14,230" fill="none" stroke="#8a7ba4" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 4"/><circle cx="14" cy="19" r="5" fill="#7256b2"/><text x="29" y="23" font-size="14" font-weight="600" text-anchor="start" fill="#7256b2"><tspan x="29" dy="0">Parent → CLI</tspan></text><text x="29" y="45" font-size="15" font-weight="500" text-anchor="start" fill="#302c3f"><tspan x="29" dy="0">Start bounded task</tspan></text><circle cx="14" cy="76" r="5" fill="#7256b2"/><text x="29" y="80" font-size="14" font-weight="600" text-anchor="start" fill="#7256b2"><tspan x="29" dy="0">CLI → Parent</tspan></text><text x="29" y="102" font-size="15" font-weight="500" text-anchor="start" fill="#302c3f"><tspan x="29" dy="0">Events + artifact + exit</tspan></text><circle cx="14" cy="133" r="5" fill="#7256b2"/><text x="29" y="137" font-size="14" font-weight="600" text-anchor="start" fill="#7256b2"><tspan x="29" dy="0">Parent → Consumer</tspan></text><text x="29" y="159" font-size="15" font-weight="500" text-anchor="start" fill="#302c3f"><tspan x="29" dy="0">Events + actual exit</tspan></text><circle cx="14" cy="190" r="5" fill="#7256b2"/><text x="29" y="194" font-size="14" font-weight="600" text-anchor="start" fill="#7256b2"><tspan x="29" dy="0">Consumer → Parent</tspan></text><text x="29" y="216" font-size="15" font-weight="500" text-anchor="start" fill="#302c3f"><tspan x="29" dy="0">Checked report or error</tspan></text><text x="144" y="268" font-size="14" font-weight="400" text-anchor="middle" fill="#5e586f"><tspan x="144" dy="0">Accept only valid process state,</tspan><tspan x="144" dy="20">terminal event and report.</tspan></text></svg>
