<svg xmlns="http://www.w3.org/2000/svg" width="288" height="316" viewBox="0 0 288 316" role="img" aria-labelledby="title-s03-01-mobile desc-s03-01-mobile" font-family="Segoe UI, Arial, sans-serif"><title id="title-s03-01-mobile">Choose a skill only when the task benefits from reuse</title><desc id="desc-s03-01-mobile">A one-off request may need only a clear brief. A recurring task with a stable procedure and useful boundary is a candidate for a skill. Evaluate the skill against both relevant and irrelevant requests.</desc><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#8a7ba4" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="288" height="316" fill="#ffffff"/><path d="M144,62 L144,80 L69,80 L69,96" fill="none" stroke="#8a7ba4" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M144,80 L219,80 L219,96" fill="none" stroke="#8a7ba4" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="91" y="92" font-size="14" font-weight="500" text-anchor="middle" fill="#5e586f"><tspan x="91" dy="0">Yes</tspan></text><text x="241" y="92" font-size="14" font-weight="500" text-anchor="middle" fill="#5e586f"><tspan x="241" dy="0">No</tspan></text><path d="M69,162 L69,178 L144,178 L144,192" fill="none" stroke="#8a7ba4" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><g class="overview-node" data-x="22" data-y="8" data-width="244" data-height="54"><path d="M36,8 H252 L266,35 L252,62 H36 L22,35 Z" fill="#f5f1fc" stroke="#a68dcf" stroke-width="1.2"/><text x="144" y="29.5" font-size="15" font-weight="600" text-anchor="middle" fill="#302c3f"><tspan x="144" dy="0">Recurring task + stable</tspan><tspan x="144" dy="21">procedure?</tspan></text></g><g class="overview-node" data-x="4" data-y="98" data-width="130" data-height="64"><rect x="4" y="98" width="130" height="64" rx="9" fill="#ffffff" stroke="#d3ccdf" stroke-width="1.2"/><text x="69" y="124.5" font-size="15" font-weight="500" text-anchor="middle" fill="#302c3f"><tspan x="69" dy="0">Package a small</tspan><tspan x="69" dy="21">skill</tspan></text></g><g class="overview-node" data-x="154" data-y="98" data-width="130" data-height="64"><rect x="154" y="98" width="130" height="64" rx="9" fill="#ffffff" stroke="#d3ccdf" stroke-width="1.2"/><text x="219" y="124.5" font-size="15" font-weight="500" text-anchor="middle" fill="#302c3f"><tspan x="219" dy="0">Clarify a</tspan><tspan x="219" dy="21">one-off brief</tspan></text></g><g class="overview-node" data-x="14" data-y="194" data-width="260" data-height="56"><rect x="14" y="194" width="260" height="56" rx="9" fill="#ffffff" stroke="#d3ccdf" stroke-width="1.2"/><text x="144" y="216.5" font-size="15" font-weight="500" text-anchor="middle" fill="#302c3f"><tspan x="144" dy="0">Test relevant and irrelevant</tspan><tspan x="144" dy="21">requests</tspan></text></g><text x="144" y="280" font-size="14" font-weight="400" text-anchor="middle" fill="#5e586f"><tspan x="144" dy="0">Reuse is useful only when the</tspan><tspan x="144" dy="20">boundary is clear.</tspan></text></svg>
