<svg xmlns="http://www.w3.org/2000/svg" width="624" height="230" viewBox="0 0 624 230" role="img" aria-labelledby="title-s09-07 desc-s09-07" font-family="Segoe UI, Arial, sans-serif"><title id="title-s09-07">Headless success needs process and artifact checks</title><desc id="desc-s09-07">Provide bounded inputs and scope, run the non-interactive task, capture process status and outputs, and verify the report&apos;s structure and facts. A zero exit code and a saved file are necessary evidence in some workflows but are not sufficient acceptance by themselves.</desc><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#8a7ba4" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="624" height="230" fill="#ffffff"/><path d="M312,62 L312,80 L140,80 L140,106" fill="none" stroke="#8a7ba4" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M312,80 L484,80 L484,106" fill="none" stroke="#8a7ba4" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="162" y="96" font-size="14" font-weight="500" text-anchor="middle" fill="#5e586f"><tspan x="162" dy="0">Yes</tspan></text><text x="506" y="96" font-size="14" font-weight="500" text-anchor="middle" fill="#5e586f"><tspan x="506" dy="0">No</tspan></text><g class="overview-node" data-x="186" data-y="8" data-width="252" data-height="54"><path d="M200,8 H424 L438,35 L424,62 H200 L186,35 Z" fill="#f5f1fc" stroke="#a68dcf" stroke-width="1.2"/><text x="312" y="29.5" font-size="15" font-weight="600" text-anchor="middle" fill="#302c3f"><tspan x="312" dy="0">Process + report + criteria</tspan><tspan x="312" dy="21">pass?</tspan></text></g><g class="overview-node" data-x="8" data-y="108" data-width="264" data-height="64"><rect x="8" y="108" width="264" height="64" rx="9" fill="#ffffff" stroke="#d3ccdf" stroke-width="1.2"/><text x="140" y="145" font-size="15" font-weight="500" text-anchor="middle" fill="#302c3f"><tspan x="140" dy="0">Accept checked result</tspan></text></g><g class="overview-node" data-x="352" data-y="108" data-width="264" data-height="64"><rect x="352" y="108" width="264" height="64" rx="9" fill="#ffffff" stroke="#d3ccdf" stroke-width="1.2"/><text x="484" y="145" font-size="15" font-weight="500" text-anchor="middle" fill="#302c3f"><tspan x="484" dy="0">Report failure or gap</tspan></text></g><text x="312" y="206" font-size="14" font-weight="400" text-anchor="middle" fill="#5e586f"><tspan x="312" dy="0">Run bounded codex exec; a saved file alone is not success.</tspan></text></svg>
