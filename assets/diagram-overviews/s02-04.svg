<svg xmlns="http://www.w3.org/2000/svg" width="624" height="192" viewBox="0 0 624 192" role="img" aria-labelledby="title-s02-04 desc-s02-04" font-family="Segoe UI, Arial, sans-serif"><title id="title-s02-04">Prose guidance and command rules solve different problems</title><desc id="desc-s02-04">Nested AGENTS.md and explicit reference documents describe the work. Command rules evaluate execution-policy decisions. Neither is a mechanical substitute for the other, and discovery and policy need different tests.</desc><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#8a7ba4" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="624" height="192" fill="#ffffff"/><g class="overview-node" data-x="8" data-y="8" data-width="180" data-height="54"><rect x="8" y="8" width="180" height="54" rx="9" fill="#f5f1fc" stroke="#a68dcf" stroke-width="1.2"/><text x="98" y="40" font-size="15" font-weight="600" text-anchor="middle" fill="#302c3f"><tspan x="98" dy="0">AGENTS.md</tspan></text></g><path d="M188,35 L230,35" fill="none" stroke="#8a7ba4" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><g class="overview-node" data-x="232" data-y="8" data-width="384" data-height="54"><rect x="232" y="8" width="384" height="54" rx="9" fill="#ffffff" stroke="#d3ccdf" stroke-width="1.2"/><text x="424" y="40" font-size="15" font-weight="500" text-anchor="middle" fill="#302c3f"><tspan x="424" dy="0">How to work: scope and guidance</tspan></text></g><g class="overview-node" data-x="8" data-y="71" data-width="180" data-height="54"><rect x="8" y="71" width="180" height="54" rx="9" fill="#f5f1fc" stroke="#a68dcf" stroke-width="1.2"/><text x="98" y="92.5" font-size="15" font-weight="600" text-anchor="middle" fill="#302c3f"><tspan x="98" dy="0">Command</tspan><tspan x="98" dy="21">rules</tspan></text></g><path d="M188,98 L230,98" fill="none" stroke="#8a7ba4" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><g class="overview-node" data-x="232" data-y="71" data-width="384" data-height="54"><rect x="232" y="71" width="384" height="54" rx="9" fill="#ffffff" stroke="#d3ccdf" stroke-width="1.2"/><text x="424" y="92.5" font-size="15" font-weight="500" text-anchor="middle" fill="#302c3f"><tspan x="424" dy="0">Match command</tspan><tspan x="424" dy="21">against policy</tspan></text></g><text x="312" y="174" font-size="14" font-weight="400" text-anchor="middle" fill="#5e586f"><tspan x="312" dy="0">Test instruction discovery and policy separately.</tspan></text></svg>
