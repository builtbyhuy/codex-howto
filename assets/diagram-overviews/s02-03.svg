<svg xmlns="http://www.w3.org/2000/svg" width="624" height="200" viewBox="0 0 624 200" role="img" aria-labelledby="title-s02-03 desc-s02-03" font-family="Segoe UI, Arial, sans-serif"><title id="title-s02-03">Instruction discovery follows the working-directory path</title><desc id="desc-s02-03">The global layer precedes repository guidance, followed by directories along the path to the working directory. At each directory, an override replaces the ordinary file selected at that same level. An unrelated sibling does not join the chain.</desc><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#8a7ba4" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="624" height="200" fill="#ffffff"/><path d="M139,69 L165,69" fill="none" stroke="#8a7ba4" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M298,69 L324,69" fill="none" stroke="#8a7ba4" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M457,69 L483,69" fill="none" stroke="#8a7ba4" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><g class="overview-node" data-x="8" data-y="32" data-width="131" data-height="74"><rect x="8" y="32" width="131" height="74" rx="9" fill="#f5f1fc" stroke="#a68dcf" stroke-width="1.2"/><text x="73.5" y="74" font-size="15" font-weight="600" text-anchor="middle" fill="#302c3f"><tspan x="73.5" dy="0">Global guidance</tspan></text></g><g class="overview-node" data-x="167" data-y="32" data-width="131" data-height="74"><rect x="167" y="32" width="131" height="74" rx="9" fill="#ffffff" stroke="#d3ccdf" stroke-width="1.2"/><text x="232.5" y="74" font-size="15" font-weight="500" text-anchor="middle" fill="#302c3f"><tspan x="232.5" dy="0">Repository root</tspan></text></g><g class="overview-node" data-x="326" data-y="32" data-width="131" data-height="74"><rect x="326" y="32" width="131" height="74" rx="9" fill="#ffffff" stroke="#d3ccdf" stroke-width="1.2"/><text x="391.5" y="63.5" font-size="15" font-weight="500" text-anchor="middle" fill="#302c3f"><tspan x="391.5" dy="0">Directories on</tspan><tspan x="391.5" dy="21">path</tspan></text></g><g class="overview-node" data-x="485" data-y="32" data-width="131" data-height="74"><rect x="485" y="32" width="131" height="74" rx="9" fill="#ffffff" stroke="#d3ccdf" stroke-width="1.2"/><text x="550.5" y="63.5" font-size="15" font-weight="500" text-anchor="middle" fill="#302c3f"><tspan x="550.5" dy="0">Working</tspan><tspan x="550.5" dy="21">directory</tspan></text></g><text x="312" y="153" font-size="14" font-weight="400" text-anchor="middle" fill="#5e586f"><tspan x="312" dy="0">At each level, override replaces the ordinary file.</tspan></text></svg>
