<svg xmlns="http://www.w3.org/2000/svg" width="624" height="200" viewBox="0 0 624 200" role="img" aria-labelledby="title-s09-02 desc-s09-02" font-family="Segoe UI, Arial, sans-serif"><title id="title-s09-02">Planning resolves decisions before implementation</title><desc id="desc-s09-02">Inspect constraints, compare options, and make a concrete plan with acceptance checks. Resolve a material missing decision before implementation. Check the implemented result against the plan and update it when evidence changes.</desc><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#8a7ba4" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="624" height="200" fill="#ffffff"/><path d="M139,92 L165,92" fill="none" stroke="#8a7ba4" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M298,92 L324,92" fill="none" stroke="#8a7ba4" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M457,92 L483,92" fill="none" stroke="#8a7ba4" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M550.5,55 L550.5,18 L73.5,18 L73.5,53" fill="none" stroke="#8a7ba4" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 4" marker-end="url(#arrow)"/><g class="overview-node" data-x="8" data-y="55" data-width="131" data-height="74"><rect x="8" y="55" width="131" height="74" rx="9" fill="#f5f1fc" stroke="#a68dcf" stroke-width="1.2"/><text x="73.5" y="86.5" font-size="15" font-weight="600" text-anchor="middle" fill="#302c3f"><tspan x="73.5" dy="0">Inspect</tspan><tspan x="73.5" dy="21">constraints</tspan></text></g><g class="overview-node" data-x="167" data-y="55" data-width="131" data-height="74"><rect x="167" y="55" width="131" height="74" rx="9" fill="#ffffff" stroke="#d3ccdf" stroke-width="1.2"/><text x="232.5" y="86.5" font-size="15" font-weight="500" text-anchor="middle" fill="#302c3f"><tspan x="232.5" dy="0">Compare</tspan><tspan x="232.5" dy="21">approaches</tspan></text></g><g class="overview-node" data-x="326" data-y="55" data-width="131" data-height="74"><rect x="326" y="55" width="131" height="74" rx="9" fill="#ffffff" stroke="#d3ccdf" stroke-width="1.2"/><text x="391.5" y="86.5" font-size="15" font-weight="500" text-anchor="middle" fill="#302c3f"><tspan x="391.5" dy="0">Plan +</tspan><tspan x="391.5" dy="21">acceptance</tspan></text></g><g class="overview-node" data-x="485" data-y="55" data-width="131" data-height="74"><rect x="485" y="55" width="131" height="74" rx="9" fill="#ffffff" stroke="#d3ccdf" stroke-width="1.2"/><text x="550.5" y="86.5" font-size="15" font-weight="500" text-anchor="middle" fill="#302c3f"><tspan x="550.5" dy="0">Implement +</tspan><tspan x="550.5" dy="21">verify</tspan></text></g><text x="312" y="171" font-size="14" font-weight="400" text-anchor="middle" fill="#5e586f"><tspan x="312" dy="0">Resolve material decisions first; revise with new evidence.</tspan></text></svg>
