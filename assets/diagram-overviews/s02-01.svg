<svg xmlns="http://www.w3.org/2000/svg" width="624" height="236" viewBox="0 0 624 236" role="img" aria-labelledby="title-s02-01 desc-s02-01" font-family="Segoe UI, Arial, sans-serif"><title id="title-s02-01">Instructions, working evidence, and memory are distinct inputs</title><desc id="desc-s02-01">AGENTS.md supplies project guidance, current files supply evidence, and eligible memory may help retrieve context. These inputs meet at the task, but a remembered claim still needs checking against its current source.</desc><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#8a7ba4" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="624" height="236" fill="#ffffff"/><g class="overview-node" data-x="8" data-y="8" data-width="184" data-height="66"><rect x="8" y="8" width="184" height="66" rx="9" fill="#ffffff" stroke="#d3ccdf" stroke-width="1.2"/><text x="100" y="46" font-size="15" font-weight="500" text-anchor="middle" fill="#302c3f"><tspan x="100" dy="0">AGENTS.md guidance</tspan></text></g><path d="M100,74 L100,100 L312,100" fill="none" stroke="#8a7ba4" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><g class="overview-node" data-x="220" data-y="8" data-width="184" data-height="66"><rect x="220" y="8" width="184" height="66" rx="9" fill="#ffffff" stroke="#d3ccdf" stroke-width="1.2"/><text x="312" y="35.5" font-size="15" font-weight="500" text-anchor="middle" fill="#302c3f"><tspan x="312" dy="0">Current project</tspan><tspan x="312" dy="21">files</tspan></text></g><path d="M312,74 L312,100 L312,100" fill="none" stroke="#8a7ba4" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><g class="overview-node" data-x="432" data-y="8" data-width="184" data-height="66"><rect x="432" y="8" width="184" height="66" rx="9" fill="#ffffff" stroke="#d3ccdf" stroke-width="1.2"/><text x="524" y="35.5" font-size="15" font-weight="500" text-anchor="middle" fill="#302c3f"><tspan x="524" dy="0">Memory: verify</tspan><tspan x="524" dy="21">source</tspan></text></g><path d="M524,74 L524,100 L312,100" fill="none" stroke="#8a7ba4" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M312,100 L312,128" fill="none" stroke="#8a7ba4" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><g class="overview-node" data-x="126" data-y="130" data-width="372" data-height="58"><rect x="126" y="130" width="372" height="58" rx="9" fill="#f5f1fc" stroke="#a68dcf" stroke-width="1.2"/><text x="312" y="164" font-size="15" font-weight="600" text-anchor="middle" fill="#302c3f"><tspan x="312" dy="0">Current task + checked result</tspan></text></g><text x="312" y="219" font-size="14" font-weight="400" text-anchor="middle" fill="#5e586f"><tspan x="312" dy="0">Remembered context still needs a current-source check.</tspan></text></svg>
