<svg xmlns="http://www.w3.org/2000/svg" width="288" height="306" viewBox="0 0 288 306" role="img" aria-labelledby="title-s04-02-mobile desc-s04-02-mobile" font-family="Segoe UI, Arial, sans-serif"><title id="title-s04-02-mobile">A role file specializes instructions within inherited boundaries</title><desc id="desc-s04-02-mobile">The parent session supplies execution limits and connected capabilities. A TOML role supplies focused instructions. A particular delegated task narrows the immediate work further; the role description does not expand its permissions.</desc><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#8a7ba4" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="288" height="306" fill="#ffffff"/><g class="overview-node" data-x="32" data-y="8" data-width="248" data-height="44"><rect x="32" y="8" width="248" height="44" rx="9" fill="#ffffff" stroke="#d3ccdf" stroke-width="1.2"/><text x="156" y="35" font-size="15" font-weight="500" text-anchor="middle" fill="#302c3f"><tspan x="156" dy="0">Parent execution limits</tspan></text></g><path d="M32,30 L13,30" fill="none" stroke="#8a7ba4" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><g class="overview-node" data-x="32" data-y="62" data-width="248" data-height="44"><rect x="32" y="62" width="248" height="44" rx="9" fill="#ffffff" stroke="#d3ccdf" stroke-width="1.2"/><text x="156" y="89" font-size="15" font-weight="500" text-anchor="middle" fill="#302c3f"><tspan x="156" dy="0">Focused TOML role</tspan></text></g><path d="M32,84 L13,84" fill="none" stroke="#8a7ba4" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><g class="overview-node" data-x="32" data-y="116" data-width="248" data-height="44"><rect x="32" y="116" width="248" height="44" rx="9" fill="#ffffff" stroke="#d3ccdf" stroke-width="1.2"/><text x="156" y="143" font-size="15" font-weight="500" text-anchor="middle" fill="#302c3f"><tspan x="156" dy="0">Bounded delegated task</tspan></text></g><path d="M32,138 L13,138" fill="none" stroke="#8a7ba4" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M13,30 L13,221 L30,221" fill="none" stroke="#8a7ba4" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><g class="overview-node" data-x="32" data-y="194" data-width="248" data-height="54"><rect x="32" y="194" width="248" height="54" rx="9" fill="#f5f1fc" stroke="#a68dcf" stroke-width="1.2"/><text x="156" y="226" font-size="15" font-weight="600" text-anchor="middle" fill="#302c3f"><tspan x="156" dy="0">Effective worker scope</tspan></text></g><text x="144" y="272" font-size="14" font-weight="400" text-anchor="middle" fill="#5e586f"><tspan x="144" dy="0">A role description cannot expand</tspan><tspan x="144" dy="20">inherited permissions.</tspan></text></svg>
