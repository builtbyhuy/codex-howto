<svg xmlns="http://www.w3.org/2000/svg" width="624" height="200" viewBox="0 0 624 200" role="img" aria-labelledby="title-s06-07 desc-s06-07" font-family="Segoe UI, Arial, sans-serif"><title id="title-s06-07">Debug the first failing boundary</title><desc id="desc-s06-07">Check discovery, trust and event matching, interpreter startup, then the output contract. Repair the earliest demonstrated failure before changing later stages. A valid JSON response is not proof that the event was delivered by a real client.</desc><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#8a7ba4" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="624" height="200" fill="#ffffff"/><path d="M139,69 L165,69" fill="none" stroke="#8a7ba4" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M298,69 L324,69" fill="none" stroke="#8a7ba4" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M457,69 L483,69" fill="none" stroke="#8a7ba4" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><g class="overview-node" data-x="8" data-y="32" data-width="131" data-height="74"><rect x="8" y="32" width="131" height="74" rx="9" fill="#f5f1fc" stroke="#a68dcf" stroke-width="1.2"/><text x="73.5" y="63.5" font-size="15" font-weight="600" text-anchor="middle" fill="#302c3f"><tspan x="73.5" dy="0">Discover</tspan><tspan x="73.5" dy="21">definition</tspan></text></g><g class="overview-node" data-x="167" data-y="32" data-width="131" data-height="74"><rect x="167" y="32" width="131" height="74" rx="9" fill="#ffffff" stroke="#d3ccdf" stroke-width="1.2"/><text x="232.5" y="63.5" font-size="15" font-weight="500" text-anchor="middle" fill="#302c3f"><tspan x="232.5" dy="0">Trust + event</tspan><tspan x="232.5" dy="21">match</tspan></text></g><g class="overview-node" data-x="326" data-y="32" data-width="131" data-height="74"><rect x="326" y="32" width="131" height="74" rx="9" fill="#ffffff" stroke="#d3ccdf" stroke-width="1.2"/><text x="391.5" y="63.5" font-size="15" font-weight="500" text-anchor="middle" fill="#302c3f"><tspan x="391.5" dy="0">Start</tspan><tspan x="391.5" dy="21">interpreter</tspan></text></g><g class="overview-node" data-x="485" data-y="32" data-width="131" data-height="74"><rect x="485" y="32" width="131" height="74" rx="9" fill="#ffffff" stroke="#d3ccdf" stroke-width="1.2"/><text x="550.5" y="63.5" font-size="15" font-weight="500" text-anchor="middle" fill="#302c3f"><tspan x="550.5" dy="0">Validate result</tspan><tspan x="550.5" dy="21">contract</tspan></text></g><text x="312" y="153" font-size="14" font-weight="400" text-anchor="middle" fill="#5e586f"><tspan x="312" dy="0">Repair the first failing boundary; then observe client effect.</tspan></text></svg>
