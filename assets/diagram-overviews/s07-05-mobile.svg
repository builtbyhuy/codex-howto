<svg xmlns="http://www.w3.org/2000/svg" width="288" height="288" viewBox="0 0 288 288" role="img" aria-labelledby="title-s07-05-mobile desc-s07-05-mobile" font-family="Segoe UI, Arial, sans-serif"><title id="title-s07-05-mobile">Package, protocol, client, and outcome are distinct tests</title><desc id="desc-s07-05-mobile">Offline structural checks, executable protocol tests, and real client discovery support different claims. Combine actual output with the acceptance rubric. A changed package returns to the affected tests before release readiness is assessed again.</desc><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#8a7ba4" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="288" height="288" fill="#ffffff"/><path d="M136,55 L150,55" fill="none" stroke="#8a7ba4" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M216,94 L216,130" fill="none" stroke="#8a7ba4" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M152,171 L138,171" fill="none" stroke="#8a7ba4" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M8,171 L2,171 L2,55 L6,55" fill="none" stroke="#8a7ba4" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 4" marker-end="url(#arrow)"/><g class="overview-node" data-x="8" data-y="16" data-width="128" data-height="78"><rect x="8" y="16" width="128" height="78" rx="9" fill="#f5f1fc" stroke="#a68dcf" stroke-width="1.2"/><text x="72" y="49.5" font-size="15" font-weight="600" text-anchor="middle" fill="#302c3f"><tspan x="72" dy="0">Manifest +</tspan><tspan x="72" dy="21">paths</tspan></text></g><g class="overview-node" data-x="152" data-y="16" data-width="128" data-height="78"><rect x="152" y="16" width="128" height="78" rx="9" fill="#ffffff" stroke="#d3ccdf" stroke-width="1.2"/><text x="216" y="49.5" font-size="15" font-weight="500" text-anchor="middle" fill="#302c3f"><tspan x="216" dy="0">Handler +</tspan><tspan x="216" dy="21">protocol</tspan></text></g><g class="overview-node" data-x="152" data-y="132" data-width="128" data-height="78"><rect x="152" y="132" width="128" height="78" rx="9" fill="#ffffff" stroke="#d3ccdf" stroke-width="1.2"/><text x="216" y="165.5" font-size="15" font-weight="500" text-anchor="middle" fill="#302c3f"><tspan x="216" dy="0">Real client if</tspan><tspan x="216" dy="21">applicable</tspan></text></g><g class="overview-node" data-x="8" data-y="132" data-width="128" data-height="78"><rect x="8" y="132" width="128" height="78" rx="9" fill="#ffffff" stroke="#d3ccdf" stroke-width="1.2"/><text x="72" y="165.5" font-size="15" font-weight="500" text-anchor="middle" fill="#302c3f"><tspan x="72" dy="0">Task + failure</tspan><tspan x="72" dy="21">rubric</tspan></text></g><text x="144" y="237" font-size="14" font-weight="400" text-anchor="middle" fill="#5e586f"><tspan x="144" dy="0">Record the tested stages; repair and</tspan><tspan x="144" dy="20">rerun affected checks.</tspan></text></svg>
