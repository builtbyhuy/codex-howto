<svg xmlns="http://www.w3.org/2000/svg" width="288" height="310" viewBox="0 0 288 310" role="img" aria-labelledby="title-s07-02-mobile desc-s07-02-mobile" font-family="Segoe UI, Arial, sans-serif"><title id="title-s07-02-mobile">A multicomponent workflow still has one user outcome</title><desc id="desc-s07-02-mobile">The user selects a fictional fixture. A skill supplies the procedure; the local MCP tool reviews only permitted fixture IDs and returns evidence or an explicit error. Applicable informational hooks have separate event and trust checks. The final explanation distinguishes observed local evidence from unverified client activation.</desc><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#8a7ba4" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="288" height="310" fill="#ffffff"/><path d="M14,20 L14,230" fill="none" stroke="#8a7ba4" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 4"/><circle cx="14" cy="19" r="5" fill="#7256b2"/><text x="29" y="23" font-size="14" font-weight="600" text-anchor="start" fill="#7256b2"><tspan x="29" dy="0">User → Skill + Codex</tspan></text><text x="29" y="45" font-size="15" font-weight="500" text-anchor="start" fill="#302c3f"><tspan x="29" dy="0">Select fictional fixture</tspan></text><circle cx="14" cy="76" r="5" fill="#7256b2"/><text x="29" y="80" font-size="14" font-weight="600" text-anchor="start" fill="#7256b2"><tspan x="29" dy="0">Skill + Codex → MCP tool</tspan></text><text x="29" y="102" font-size="15" font-weight="500" text-anchor="start" fill="#302c3f"><tspan x="29" dy="0">Review permitted ID</tspan></text><circle cx="14" cy="133" r="5" fill="#7256b2"/><text x="29" y="137" font-size="14" font-weight="600" text-anchor="start" fill="#7256b2"><tspan x="29" dy="0">MCP tool → Skill + Codex</tspan></text><text x="29" y="159" font-size="15" font-weight="500" text-anchor="start" fill="#302c3f"><tspan x="29" dy="0">Evidence or explicit error</tspan></text><circle cx="14" cy="190" r="5" fill="#7256b2"/><text x="29" y="194" font-size="14" font-weight="600" text-anchor="start" fill="#7256b2"><tspan x="29" dy="0">Skill + Codex → User</tspan></text><text x="29" y="216" font-size="15" font-weight="500" text-anchor="start" fill="#302c3f"><tspan x="29" dy="0">Findings + limits</tspan></text><text x="144" y="268" font-size="14" font-weight="400" text-anchor="middle" fill="#5e586f"><tspan x="144" dy="0">Informational hooks have separate</tspan><tspan x="144" dy="20">trust and event checks.</tspan></text></svg>
