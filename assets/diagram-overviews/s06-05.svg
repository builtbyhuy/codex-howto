<svg xmlns="http://www.w3.org/2000/svg" width="624" height="286" viewBox="0 0 624 286" role="img" aria-labelledby="title-s06-05 desc-s06-05" font-family="Segoe UI, Arial, sans-serif"><title id="title-s06-05">A handler must distinguish a valid request from malformed input</title><desc id="desc-s06-05">A launch failure produces no handler decision. Once started, malformed input is handled as a denial at exit zero. A valid but out-of-scope event or tool produces an empty response with no policy decision. A matched valid patch is denied when a protected target matches, or produces no objection otherwise. Exit zero means the handler produced its response; the JSON and client policy determine the effect.</desc><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#8a7ba4" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="624" height="286" fill="#ffffff"/><text x="20" y="18" font-size="14" font-weight="600" text-anchor="start" fill="#5e586f"><tspan x="20" dy="0">Handler input</tspan></text><text x="278" y="18" font-size="14" font-weight="600" text-anchor="start" fill="#5e586f"><tspan x="278" dy="0">Response</tspan></text><text x="20" y="59" font-size="15" font-weight="600" text-anchor="start" fill="#7256b2"><tspan x="20" dy="0">Malformed input</tspan></text><path d="M238,54 L264,54" fill="none" stroke="#8a7ba4" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="278" y="59" font-size="15" font-weight="500" text-anchor="start" fill="#302c3f"><tspan x="278" dy="0">Deny · exit 0</tspan></text><path d="M8,79 H616" stroke="#ece8f4" stroke-width="1"/><text x="20" y="111" font-size="15" font-weight="600" text-anchor="start" fill="#7256b2"><tspan x="20" dy="0">Protected target</tspan></text><path d="M238,106 L264,106" fill="none" stroke="#8a7ba4" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="278" y="111" font-size="15" font-weight="500" text-anchor="start" fill="#302c3f"><tspan x="278" dy="0">Deny · exit 0</tspan></text><path d="M8,131 H616" stroke="#ece8f4" stroke-width="1"/><text x="20" y="163" font-size="15" font-weight="600" text-anchor="start" fill="#7256b2"><tspan x="20" dy="0">Unmatched / safe</tspan></text><path d="M238,158 L264,158" fill="none" stroke="#8a7ba4" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="278" y="163" font-size="15" font-weight="500" text-anchor="start" fill="#302c3f"><tspan x="278" dy="0">No decision · exit 0</tspan></text><path d="M8,183 H616" stroke="#ece8f4" stroke-width="1"/><text x="20" y="215" font-size="15" font-weight="600" text-anchor="start" fill="#7256b2"><tspan x="20" dy="0">Launch failure</tspan></text><path d="M238,210 L264,210" fill="none" stroke="#8a7ba4" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="278" y="215" font-size="15" font-weight="500" text-anchor="start" fill="#302c3f"><tspan x="278" dy="0">No handler response</tspan></text><text x="312" y="264" font-size="14" font-weight="400" text-anchor="middle" fill="#5e586f"><tspan x="312" dy="0">The client interprets the response and its failure policy.</tspan></text></svg>
