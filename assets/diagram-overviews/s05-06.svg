<svg xmlns="http://www.w3.org/2000/svg" width="624" height="238" viewBox="0 0 624 238" role="img" aria-labelledby="title-s05-06 desc-s05-06" font-family="Segoe UI, Arial, sans-serif"><title id="title-s05-06">Choose external tools, bounded execution, or application embedding</title><desc id="desc-s05-06">Connecting external capabilities to Codex, running a one-shot Codex task, and embedding Codex in a custom application are different requirements. The experimental app-server protocol is not a drop-in MCP-server replacement.</desc><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#8a7ba4" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="624" height="238" fill="#ffffff"/><path d="M312,60 L312,85 L100,85 L100,106" fill="none" stroke="#8a7ba4" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M312,85 L312,106" fill="none" stroke="#8a7ba4" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M312,85 L524,85 L524,106" fill="none" stroke="#8a7ba4" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><g class="overview-node" data-x="186" data-y="8" data-width="252" data-height="52"><rect x="186" y="8" width="252" height="52" rx="9" fill="#f5f1fc" stroke="#a68dcf" stroke-width="1.2"/><text x="312" y="39" font-size="15" font-weight="600" text-anchor="middle" fill="#302c3f"><tspan x="312" dy="0">What needs to connect?</tspan></text></g><g class="overview-node" data-x="8" data-y="108" data-width="184" data-height="70"><rect x="8" y="108" width="184" height="70" rx="9" fill="#ffffff" stroke="#d3ccdf" stroke-width="1.2"/><text x="100" y="148" font-size="15" font-weight="500" text-anchor="middle" fill="#302c3f"><tspan x="100" dy="0">External tools → MCP</tspan></text></g><g class="overview-node" data-x="220" data-y="108" data-width="184" data-height="70"><rect x="220" y="108" width="184" height="70" rx="9" fill="#ffffff" stroke="#d3ccdf" stroke-width="1.2"/><text x="312" y="148" font-size="15" font-weight="500" text-anchor="middle" fill="#302c3f"><tspan x="312" dy="0">One task → codex exec</tspan></text></g><g class="overview-node" data-x="432" data-y="108" data-width="184" data-height="70"><rect x="432" y="108" width="184" height="70" rx="9" fill="#ffffff" stroke="#d3ccdf" stroke-width="1.2"/><text x="524" y="137.5" font-size="15" font-weight="500" text-anchor="middle" fill="#302c3f"><tspan x="524" dy="0">Custom app →</tspan><tspan x="524" dy="21">app-server</tspan></text></g><text x="312" y="213" font-size="14" font-weight="400" text-anchor="middle" fill="#5e586f"><tspan x="312" dy="0">Experimental app-server is not an MCP-server replacement.</tspan></text></svg>
