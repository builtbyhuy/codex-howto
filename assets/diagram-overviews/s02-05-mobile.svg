<svg xmlns="http://www.w3.org/2000/svg" width="288" height="316" viewBox="0 0 288 316" role="img" aria-labelledby="title-s02-05-mobile desc-s02-05-mobile" font-family="Segoe UI, Arial, sans-serif"><title id="title-s02-05-mobile">Use memory only after checking its applicability</title><desc id="desc-s02-05-mobile">If local memories are unavailable or disabled, use explicit project records. If a memory is available, verify its scope and current source before relying on it. A closed chat is not proof that memory generation completed.</desc><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#8a7ba4" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="288" height="316" fill="#ffffff"/><path d="M144,62 L144,80 L69,80 L69,96" fill="none" stroke="#8a7ba4" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M144,80 L219,80 L219,96" fill="none" stroke="#8a7ba4" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="91" y="92" font-size="14" font-weight="500" text-anchor="middle" fill="#5e586f"><tspan x="91" dy="0">Yes</tspan></text><text x="241" y="92" font-size="14" font-weight="500" text-anchor="middle" fill="#5e586f"><tspan x="241" dy="0">No</tspan></text><path d="M69,162 L69,178 L144,178 L144,192" fill="none" stroke="#8a7ba4" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M219,162 L219,178 L144,178" fill="none" stroke="#8a7ba4" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><g class="overview-node" data-x="22" data-y="8" data-width="244" data-height="54"><path d="M36,8 H252 L266,35 L252,62 H36 L22,35 Z" fill="#f5f1fc" stroke="#a68dcf" stroke-width="1.2"/><text x="144" y="40" font-size="15" font-weight="600" text-anchor="middle" fill="#302c3f"><tspan x="144" dy="0">Memory available + verified?</tspan></text></g><g class="overview-node" data-x="4" data-y="98" data-width="130" data-height="64"><rect x="4" y="98" width="130" height="64" rx="9" fill="#ffffff" stroke="#d3ccdf" stroke-width="1.2"/><text x="69" y="124.5" font-size="15" font-weight="500" text-anchor="middle" fill="#302c3f"><tspan x="69" dy="0">Use eligible</tspan><tspan x="69" dy="21">context</tspan></text></g><g class="overview-node" data-x="154" data-y="98" data-width="130" data-height="64"><rect x="154" y="98" width="130" height="64" rx="9" fill="#ffffff" stroke="#d3ccdf" stroke-width="1.2"/><text x="219" y="124.5" font-size="15" font-weight="500" text-anchor="middle" fill="#302c3f"><tspan x="219" dy="0">Use project</tspan><tspan x="219" dy="21">records</tspan></text></g><g class="overview-node" data-x="14" data-y="194" data-width="260" data-height="56"><rect x="14" y="194" width="260" height="56" rx="9" fill="#ffffff" stroke="#d3ccdf" stroke-width="1.2"/><text x="144" y="216.5" font-size="15" font-weight="500" text-anchor="middle" fill="#302c3f"><tspan x="144" dy="0">Keep canonical decisions in the</tspan><tspan x="144" dy="21">project</tspan></text></g><text x="144" y="280" font-size="14" font-weight="400" text-anchor="middle" fill="#5e586f"><tspan x="144" dy="0">A closed chat does not prove memory</tspan><tspan x="144" dy="20">was generated.</tspan></text></svg>
