<svg xmlns="http://www.w3.org/2000/svg" width="288" height="306" viewBox="0 0 288 306" role="img" aria-labelledby="title-s03-03-mobile desc-s03-03-mobile" font-family="Segoe UI, Arial, sans-serif"><title id="title-s03-03-mobile">A project skill is a small package with an executable test boundary</title><desc id="desc-s03-03-mobile">The project skill directory contains required metadata and instructions, plus optional supporting files. A fixture and rubric let you check actual output rather than accepting discovery alone as success.</desc><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#8a7ba4" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="288" height="306" fill="#ffffff"/><path d="M164,56 L164,68 L20,68 L20,214" fill="none" stroke="#8a7ba4" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M20,98 L42,98" fill="none" stroke="#8a7ba4" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M20,156 L42,156" fill="none" stroke="#8a7ba4" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M20,214 L42,214" fill="none" stroke="#8a7ba4" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><g class="overview-node" data-x="44" data-y="8" data-width="236" data-height="48"><rect x="44" y="8" width="236" height="48" rx="9" fill="#f5f1fc" stroke="#a68dcf" stroke-width="1.2"/><text x="162" y="37" font-size="15" font-weight="600" text-anchor="middle" fill="#302c3f"><tspan x="162" dy="0">Project skill package</tspan></text></g><g class="overview-node" data-x="44" data-y="76" data-width="236" data-height="44"><rect x="44" y="76" width="236" height="44" rx="9" fill="#ffffff" stroke="#d3ccdf" stroke-width="1.2"/><text x="162" y="103" font-size="15" font-weight="500" text-anchor="middle" fill="#302c3f"><tspan x="162" dy="0">Metadata: discovery</tspan></text></g><g class="overview-node" data-x="44" data-y="134" data-width="236" data-height="44"><rect x="44" y="134" width="236" height="44" rx="9" fill="#ffffff" stroke="#d3ccdf" stroke-width="1.2"/><text x="162" y="161" font-size="15" font-weight="500" text-anchor="middle" fill="#302c3f"><tspan x="162" dy="0">Procedure: execution</tspan></text></g><g class="overview-node" data-x="44" data-y="192" data-width="236" data-height="44"><rect x="44" y="192" width="236" height="44" rx="9" fill="#ffffff" stroke="#d3ccdf" stroke-width="1.2"/><text x="162" y="219" font-size="15" font-weight="500" text-anchor="middle" fill="#302c3f"><tspan x="162" dy="0">Fixture + rubric: test</tspan></text></g><text x="144" y="266" font-size="14" font-weight="400" text-anchor="middle" fill="#5e586f"><tspan x="144" dy="0">Discovery alone does not prove a</tspan><tspan x="144" dy="20">correct output.</tspan></text></svg>
