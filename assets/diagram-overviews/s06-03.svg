<svg xmlns="http://www.w3.org/2000/svg" width="624" height="192" viewBox="0 0 624 192" role="img" aria-labelledby="title-s06-03 desc-s06-03" font-family="Segoe UI, Arial, sans-serif"><title id="title-s06-03">Choose between a local command and an existing MCP tool</title><desc id="desc-s06-03">A deterministic local check can use a command handler. A check that needs an already connected capability may use a supported MCP tool handler. These are alternatives. Both need explicit failure tests, and a preventive gate needs a synchronous supported decision path.</desc><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#8a7ba4" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="624" height="192" fill="#ffffff"/><g class="overview-node" data-x="8" data-y="8" data-width="180" data-height="54"><rect x="8" y="8" width="180" height="54" rx="9" fill="#f5f1fc" stroke="#a68dcf" stroke-width="1.2"/><text x="98" y="40" font-size="15" font-weight="600" text-anchor="middle" fill="#302c3f"><tspan x="98" dy="0">Local check</tspan></text></g><path d="M188,35 L230,35" fill="none" stroke="#8a7ba4" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><g class="overview-node" data-x="232" data-y="8" data-width="384" data-height="54"><rect x="232" y="8" width="384" height="54" rx="9" fill="#ffffff" stroke="#d3ccdf" stroke-width="1.2"/><text x="424" y="29.5" font-size="15" font-weight="500" text-anchor="middle" fill="#302c3f"><tspan x="424" dy="0">Command</tspan><tspan x="424" dy="21">handler</tspan></text></g><g class="overview-node" data-x="8" data-y="71" data-width="180" data-height="54"><rect x="8" y="71" width="180" height="54" rx="9" fill="#f5f1fc" stroke="#a68dcf" stroke-width="1.2"/><text x="98" y="103" font-size="15" font-weight="600" text-anchor="middle" fill="#302c3f"><tspan x="98" 