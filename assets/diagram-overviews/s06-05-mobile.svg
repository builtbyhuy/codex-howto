<svg xmlns="http://www.w3.org/2000/svg" width="288" height="320" viewBox="0 0 288 320" role="img" aria-labelledby="title-s06-05-mobile desc-s06-05-mobile" font-family="Segoe UI, Arial, sans-serif"><title id="title-s06-05-mobile">A handler must distinguish a valid request from malformed input</title><desc id="desc-s06-05-mobile">A launch failure produces no handler decision. Once started, malformed input is handled as a denial at exit zero. A valid but out-of-scope event or tool produces an empty response with no policy decision. A matched valid patch is denied when a protected target matches, or produces no objection otherwise. Exit zero means the handler produced its response; the JSON and client policy determine the effect.</desc><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#8a7ba4" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="288" height="320" fill="#ffffff"/><text x="12" y="18" font-size="14" font-weight="600" text-anchor="start" fill="#5e586f"><tspan x="12" dy="0">Handler input</tspan></text><text x="158" y="18" font-size="14" font-weight="600" text-anchor="start" fill="#5e586f"><tspan x="158" dy="0">Response</tspan></text><text x="12" y="52.5" font-size="15" font-weight="600" text-anchor="start" fill="#7256b2"><tspan x="12" dy="0">Malformed</tspan><tspan x="12" dy="21">input</tspan></text><path d="M130,58 L146,58" fill="none" stroke="#8a7ba4" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="158" y="63" font-size="15" font-weight="500" text-anchor="start" fill="#302c3f"><tspan x="158" dy="0">Deny · exit 0</tspan></text><path d="M8,87 H280" stroke="#ece8f4" stroke-width="1"/><text x="12" y="110.5" font-size="15" font-weight="600" text-anchor="start" fill="#7256b2"><tspan x="12" dy="0">Protected</tspan><tspan x="12" dy="21">target</tspan></text><path d="M130,116 L146,116" fill="none" stroke="#8a7ba4" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="158" y="121" font-size="15" font-weight="500" text-anchor="start" fill="#302c3f"><tspan x="158" dy="0">Deny · exit 0</tspan></text><path d="M8,145 H280" stroke="#ece8f4" stroke-width="1"/><text x="12" y="168.5" font-size="15" font-weight="600" text-anchor="start" fill="#7256b2"><tspan x="12" dy="0">Unmatched /</tspan><tspan x="12" dy="21">safe</tspan></text><path d="M130,174 L146,174" fill="none" stroke="#8a7ba4" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="158" y="168.5" font-size="15" font-weight="500" text-anchor="start" fill="#302c3f"><tspan x="158" dy="0">No decision ·</tspan><tspan x="158" dy="21">exit 0</tspan></text><path d="M8,203 H280" stroke="#ece8f4" stroke-width="1"/><text x="12" y="237" font-size="15" font-weight="600" text-anchor="start" fill="#7256b2"><tspan x="12" dy="0">Launch failure</tspan></text><path d="M130,232 L146,232" fill="none" stroke="#8a7ba4" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="158" y="226.5" font-size="15" font-weight="500" text-anchor="start" fill="#302c3f"><tspan x="158" dy="0">No handler</tspan><tspan x="158" dy="21">response</tspan></text><text x="144" y="286" font-size="14" font-weight="400" text-anchor="middle" fill="#5e586f"><tspan x="144" dy="0">The client interprets the response</tspan><tspan x="144" dy="20">and its failure policy.</tspan></text></svg>
