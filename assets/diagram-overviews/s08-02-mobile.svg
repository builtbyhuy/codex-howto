<svg xmlns="http://www.w3.org/2000/svg" width="288" height="270" viewBox="0 0 288 270" role="img" aria-labelledby="title-s08-02-mobile desc-s08-02-mobile" font-family="Segoe UI, Arial, sans-serif"><title id="title-s08-02-mobile">Inspect both the change and its baseline</title><desc id="desc-s08-02-mobile">A working-tree diff shows current edits. The baseline establishes the desired earlier content. Compare both, preserve unrelated work, and choose a named-file or targeted correction.</desc><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#8a7ba4" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="288" height="270" fill="#ffffff"/><g class="overview-node" data-x="32" data-y="8" data-width="248" data-height="44"><rect x="32" y="8" width="248" height="44" rx="9" fill="#ffffff" stroke="#d3ccdf" stroke-width="1.2"/><text x="156" y="35" font-size="15" font-weight="500" text-anchor="middle" fill="#302c3f"><tspan x="156" dy="0">Current file + diff</tspan></text></g><path d="M32,30 L13,30" fill="none" stroke="#8a7ba4" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><g class="overview-node" data-x="32" data-y="62" data-width="248" data-height="44"><rect x="32" y="62" width="248" height="44" rx="9" fill="#ffffff" stroke="#d3ccdf" stroke-width="1.2"/><text x="156" y="89" font-size="15" font-weight="500" text-anchor="middle" fill="#302c3f"><tspan x="156" dy="0">Verified baseline</tspan></text></g><path d="M32,84 L13,84" fill="none" stroke="#8a7ba4" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M13,30 L13,177 L30,177" fill="none" stroke="#8a7ba4" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><g class="overview-node" data-x="32" data-y="150" data-width="248" data-height="54"><rect x="32" y="150" width="248" height="54" rx="9" fill="#f5f1fc" stroke="#a68dcf" stroke-width="1.2"/><text x="156" y="171.5" font-size="15" font-weight="600" text-anchor="middle" fill="#302c3f"><tspan x="156" dy="0">Targeted correction; preserve</tspan><tspan x="156" dy="21">useful work</tspan></text></g><text x="144" y="228" font-size="14" font-weight="400" text-anchor="middle" fill="#5e586f"><tspan x="144" dy="0">Review the final diff before</tspan><tspan x="144" dy="20">accepting the correction.</tspan></text></svg>
