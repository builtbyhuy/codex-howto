<svg xmlns="http://www.w3.org/2000/svg" width="288" height="320" viewBox="0 0 288 320" role="img" aria-labelledby="title-s09-01-mobile desc-s09-01-mobile" font-family="Segoe UI, Arial, sans-serif"><title id="title-s09-01-mobile">Choose the smallest workflow that meets the outcome</title><desc id="desc-s09-01-mobile">Start from the required outcome, not a feature checklist. Complex decisions may need a plan; independent tasks may benefit from delegation; repeatable bounded tasks may use scripted execution. Every path returns to the same acceptance evidence.</desc><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#8a7ba4" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="288" height="320" fill="#ffffff"/><text x="12" y="18" font-size="14" font-weight="600" text-anchor="start" fill="#5e586f"><tspan x="12" dy="0">Task shape</tspan></text><text x="158" y="18" font-size="14" font-weight="600" text-anchor="start" fill="#5e586f"><tspan x="158" dy="0">Useful control</tspan></text><text x="12" y="52.5" font-size="15" font-weight="600" text-anchor="start" fill="#7256b2"><tspan x="12" dy="0">Unresolved</tspan><tspan x="12" dy="21">decisions</tspan></text><path d="M130,58 L146,58" fill="none" stroke="#8a7ba4" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="158" y="63" font-size="15" font-weight="500" text-anchor="start" fill="#302c3f"><tspan x="158" dy="0">Inspect + plan</tspan></text><path d="M8,87 H280" stroke="#ece8f4" stroke-width="1"/><text x="12" y="110.5" font-size="15" font-weight="600" text-anchor="start" fill="#7256b2"><tspan x="12" dy="0">Independent</tspan><tspan x="12" dy="21">tasks</tspan></text><path d="M130,116 L146,116" fill="none" stroke="#8a7ba4" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="158" y="110.5" font-size="15" font-weight="500" text-anchor="start" fill="#302c3f"><tspan x="158" dy="0">Delegate with</tspan><tspan x="158" dy="21">owners</tspan></text><path d="M8,145 H280" stroke="#ece8f4" stroke-width="1"/><text x="12" y="168.5" font-size="15" font-weight="600" text-anchor="start" fill="#7256b2"><tspan x="12" dy="0">Repeatable</tspan><tspan x="12" dy="21">task</tspan></text><path d="M130,174 L146,174" fill="none" stroke="#8a7ba4" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="158" y="168.5" font-size="15" font-weight="500" text-anchor="start" fill="#302c3f"><tspan x="158" dy="0">Script a proven</tspan><tspan x="158" dy="21">contract</tspan></text><path d="M8,203 H280" stroke="#ece8f4" stroke-width="1"/><text x="12" y="226.5" font-size="15" font-weight="600" text-anchor="start" fill="#7256b2"><tspan x="12" dy="0">Simple local</tspan><tspan x="12" dy="21">change</tspan></text><path d="M130,232 L146,232" fill="none" stroke="#8a7ba4" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="158" y="237" font-size="15" font-weight="500" text-anchor="start" fill="#302c3f"><tspan x="158" dy="0">Work directly</tspan></text><text x="144" y="286" font-size="14" font-weight="400" text-anchor="middle" fill="#5e586f"><tspan x="144" dy="0">Every path must prove the same</tspan><tspan x="144" dy="20">required outcome.</tspan></text></svg>
