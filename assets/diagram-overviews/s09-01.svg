<svg xmlns="http://www.w3.org/2000/svg" width="624" height="286" viewBox="0 0 624 286" role="img" aria-labelledby="title-s09-01 desc-s09-01" font-family="Segoe UI, Arial, sans-serif"><title id="title-s09-01">Choose the smallest workflow that meets the outcome</title><desc id="desc-s09-01">Start from the required outcome, not a feature checklist. Complex decisions may need a plan; independent tasks may benefit from delegation; repeatable bounded tasks may use scripted execution. Every path returns to the same acceptance evidence.</desc><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#8a7ba4" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="624" height="286" fill="#ffffff"/><text x="20" y="18" font-size="14" font-weight="600" text-anchor="start" fill="#5e586f"><tspan x="20" dy="0">Task shape</tspan></text><text x="278" y="18" font-size="14" font-weight="600" text-anchor="start" fill="#5e586f"><tspan x="278" dy="0">Useful control</tspan></text><text x="20" y="59" font-size="15" font-weight="600" text-anchor="start" fill="#7256b2"><tspan x="20" dy="0">Unresolved decisions</tspan></text><path d="M238,54 L264,54" fill="none" stroke="#8a7ba4" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="278" y="59" font-size="15" font-weight="500" text-anchor="start" fill="#302c3f"><tspan x="278" dy="0">Inspect + plan</tspan></text><path d="M8,79 H616" stroke="#ece8f4" stroke-width="1"/><text x="20" y="111" font-size="15" font-weight="600" text-anchor="start" fill="#7256b2"><tspan x="20" dy="0">Independent tasks</tspan></text><path d="M238,106 L264,106" fill="none" stroke="#8a7ba4" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="278" y="111" font-size="15" font-weight="500" text-anchor="start" fill="#302c3f"><tspan x="278" dy="0">Delegate with owners</tspan></text><path d="M8,131 H616" stroke="#ece8f4" stroke-width="1"/><text x="20" y="163" font-size="15" font-weight="600" text-anchor="start" fill="#7256b2"><tspan x="20" dy="0">Repeatable task</tspan></text><path d="M238,158 L264,158" fill="none" stroke="#8a7ba4" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="278" y="163" font-size="15" font-weight="500" text-anchor="start" fill="#302c3f"><tspan x="278" dy="0">Script a proven contract</tspan></text><path d="M8,183 H616" stroke="#ece8f4" stroke-width="1"/><text x="20" y="215" font-size="15" font-weight="600" text-anchor="start" fill="#7256b2"><tspan x="20" dy="0">Simple local change</tspan></text><path d="M238,210 L264,210" fill="none" stroke="#8a7ba4" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="278" y="215" font-size="15" font-weight="500" text-anchor="start" fill="#302c3f"><tspan x="278" dy="0">Work directly</tspan></text><text x="312" y="264" font-size="14" font-weight="400" text-anchor="middle" fill="#5e586f"><tspan x="312" dy="0">Every path must prove the same required outcome.</tspan></text></svg>
