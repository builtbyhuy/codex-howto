<svg xmlns="http://www.w3.org/2000/svg" width="624" height="246" viewBox="0 0 624 246" role="img" aria-labelledby="title-s08-01 desc-s08-01" font-family="Segoe UI, Arial, sans-serif"><title id="title-s08-01">Different kinds of state need different recovery</title><desc id="desc-s08-01">Saved chat history helps recover conversation context. A Git baseline or a verified copy helps restore files. External side effects require the affected service&apos;s recovery procedure. Recovering one kind does not automatically undo the others.</desc><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#8a7ba4" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="624" height="246" fill="#ffffff"/><g class="overview-node" data-x="8" data-y="8" data-width="180" data-height="54"><rect x="8" y="8" width="180" height="54" rx="9" fill="#f5f1fc" stroke="#a68dcf" stroke-width="1.2"/><text x="98" y="40" font-size="15" font-weight="600" text-anchor="middle" fill="#302c3f"><tspan x="98" dy="0">Chat context</tspan></text></g><path d="M188,35 L230,35" fill="none" stroke="#8a7ba4" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><g class="overview-node" data-x="232" data-y="8" data-width="384" data-height="54"><rect x="232" y="8" width="384" height="54" rx="9" fill="#ffffff" stroke="#d3ccdf" stroke-width="1.2"/><text x="424" y="40" font-size="15" font-weight="500" text-anchor="middle" fill="#302c3f"><tspan x="424" dy="0">Saved chat or factual handoff</tspan></text></g><g class="overview-node" data-x="8" data-y="71" data-width="180" data-height="54"><rect x="8" y="71" width="180" height="54" rx="9" fill="#f5f1fc" stroke="#a68dcf" stroke-width="1.2"/><text x="98" y="103" font-size="15" font-weight="600" text-anchor="middle" fill="#302c3f"><tspan x="98" dy="0">Local files</tspan></text></g><path d="M188,98 L230,98" fill="none" stroke="#8a7ba4" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><g class="overview-node" data-x="232" data-y="71" data-width="384" data-height="54"><rect x="232" y="71" width="384" height="54" rx="9" fill="#ffffff" stroke="#d3ccdf" stroke-width="1.2"/><text x="424" y="103" font-size="15" font-weight="500" text-anchor="middle" fill="#302c3f"><tspan x="424" dy="0">Git baseline or verified copy</tspan></text></g><g class="overview-node" data-x="8" data-y="134" data-width="180" data-height="54"><rect x="8" y="134" width="180" height="54" rx="9" fill="#f5f1fc" stroke="#a68dcf" stroke-width="1.2"/><text x="98" y="166" font-size="15" font-weight="600" text-anchor="middle" fill="#302c3f"><tspan x="98" dy="0">External effect</tspan></text></g><path d="M188,161 L230,161" fill="none" stroke="#8a7ba4" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><g class="overview-node" data-x="232" data-y="134" data-width="384" data-height="54"><rect x="232" y="134" width="384" height="54" rx="9" fill="#ffffff" stroke="#d3ccdf" stroke-width="1.2"/><text x="424" y="166" font-size="15" font-weight="500" text-anchor="middle" fill="#302c3f"><tspan x="424" dy="0">Service-specific correction</tspan></text></g><text x="312" y="228" font-size="14" font-weight="400" text-anchor="middle" fill="#5e586f"><tspan x="312" dy="0">Recovering one kind of state does not undo the rest.</tspan></text></svg>
