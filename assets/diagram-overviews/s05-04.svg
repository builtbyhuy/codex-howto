<svg xmlns="http://www.w3.org/2000/svg" width="624" height="192" viewBox="0 0 624 192" role="img" aria-labelledby="title-s05-04 desc-s05-04" font-family="Segoe UI, Arial, sans-serif"><title id="title-s05-04">A resource URI and a tool result are different contracts</title><desc id="desc-s05-04">The client may read an advertised MCP resource or call a tool that returns source content. Either route must preserve source identity and missing-data behavior. A workspace-file mention is not evidence that a resource-mention syntax is supported.</desc><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#8a7ba4" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="624" height="192" fill="#ffffff"/><g class="overview-node" data-x="8" data-y="8" data-width="180" data-height="54"><rect x="8" y="8" width="180" height="54" rx="9" fill="#f5f1fc" stroke="#a68dcf" stroke-width="1.2"/><text x="98" y="29.5" font-size="15" font-weight="600" text-anchor="middle" fill="#302c3f"><tspan x="98" dy="0">Resource</tspan><tspan x="98" dy="21">read</tspan></text></g><path d="M188,35 L230,35" fill="none" stroke="#8a7ba4" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><g class="overview-node" data-x="232" data-y="8" data-width="384" data-height="54"><rect x="232" y="8" width="384" height="54" rx="9" fill="#ffffff" stroke="#d3ccdf" stroke-width="1.2"/><text x="424" y="40" font-size="15" font-weight="500" text-anchor="middle" fill="#302c3f"><tspan x="424" dy="0">Advertised URI → source content</tspan></text></g><g class="overview-node" data-x="8" data-y="71" data-width="180" data-height="54"><rect x="8" y="71" width="180" height="54" rx="9" fill="#f5f1fc" stroke="#a68dcf" stroke-width="1.2"/><text x="98" y="103" font-size="15" font-weight="600" text-anchor="middle" fill="#302c3f"><tspan x="98" dy="0">Tool call</tspan></text></g><path d="M188,98 L230,98" fill="none" stroke="#8a7ba4" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><g class="overview-node" data-x="232" data-y="71" data-width="384" data-height="54"><rect x="232" y="71" width="384" height="54" rx="9" fill="#ffffff" stroke="#d3ccdf" stroke-width="1.2"/><text x="424" y="103" font-size="15" font-weight="500" text-anchor="middle" fill="#302c3f"><tspan x="424" dy="0">Named tool + input → result</tspan></text></g><text x="312" y="174" font-size="14" font-weight="400" text-anchor="middle" fill="#5e586f"><tspan x="312" dy="0">Preserve source identity and explicit missing-data behavior.</tspan></text></svg>
