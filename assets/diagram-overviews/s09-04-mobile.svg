<svg xmlns="http://www.w3.org/2000/svg" width="288" height="244" viewBox="0 0 288 244" role="img" aria-labelledby="title-s09-04-mobile desc-s09-04-mobile" font-family="Segoe UI, Arial, sans-serif"><title id="title-s09-04-mobile">Automatic review operates at a permission boundary</title><desc id="desc-s09-04-mobile">An operation within current scope may proceed under effective policy. An operation needing review follows the selected review path, if available. Rejection requires a materially safer alternative or the required user decision, not repeating the same action.</desc><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#8a7ba4" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="288" height="244" fill="#ffffff"/><path d="M144,62 L144,80 L69,80 L69,96" fill="none" stroke="#8a7ba4" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M144,80 L219,80 L219,96" fill="none" stroke="#8a7ba4" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="91" y="92" font-size="14" font-weight="500" text-anchor="middle" fill="#5e586f"><tspan x="91" dy="0">Yes</tspan></text><text x="241" y="92" font-size="14" font-weight="500" text-anchor="middle" fill="#5e586f"><tspan x="241" dy="0">No</tspan></text><g class="overview-node" data-x="22" data-y="8" data-width="244" data-height="54"><path d="M36,8 H252 L266,35 L252,62 H36 L22,35 Z" fill="#f5f1fc" stroke="#a68dcf" stroke-width="1.2"/><text x="144" y="29.5" font-size="15" font-weight="600" text-anchor="middle" fill="#302c3f"><tspan x="144" dy="0">Operation within current</tspan><tspan x="144" dy="21">policy?</tspan></text></g><g class="overview-node" data-x="4" data-y="98" data-width="130" data-height="64"><rect x="4" y="98" width="130" height="64" rx="9" fill="#ffffff" stroke="#d3ccdf" stroke-width="1.2"/><text x="69" y="124.5" font-size="15" font-weight="500" text-anchor="middle" fill="#302c3f"><tspan x="69" dy="0">Run + inspect</tspan><tspan x="69" dy="21">result</tspan></text></g><g class="overview-node" data-x="154" data-y="98" data-width="130" data-height="64"><rect x="154" y="98" width="130" height="64" rx="9" fill="#ffffff" stroke="#d3ccdf" stroke-width="1.2"/><text x="219" y="124.5" font-size="15" font-weight="500" text-anchor="middle" fill="#302c3f"><tspan x="219" dy="0">Review; stop if</tspan><tspan x="219" dy="21">rejected</tspan></text></g><text x="144" y="206" font-size="14" font-weight="400" text-anchor="middle" fill="#5e586f"><tspan x="144" dy="0">Rejection needs a safer changed</tspan><tspan x="144" dy="20">action or required input.</tspan></text></svg>
