<svg xmlns="http://www.w3.org/2000/svg" width="624" height="192" viewBox="0 0 624 192" role="img" aria-labelledby="title-s01-02 desc-s01-02" font-family="Segoe UI, Arial, sans-serif"><title id="title-s01-02">A composer control and a shell command take different paths</title><desc id="desc-s01-02">Slash commands are handled by the Codex client. Shell commands are handled by the terminal process. A client diff helps inspect changes; a test process provides separate behavioral evidence.</desc><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#8a7ba4" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="624" height="192" fill="#ffffff"/><g class="overview-node" data-x="8" data-y="8" data-width="180" data-height="54"><rect x="8" y="8" width="180" height="54" rx="9" fill="#f5f1fc" stroke="#a68dcf" stroke-width="1.2"/><text x="98" y="40" font-size="15" font-weight="600" text-anchor="middle" fill="#302c3f"><tspan x="98" dy="0">Composer</tspan></text></g><path d="M188,35 L230,35" fill="none" stroke="#8a7ba4" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><g class="overview-node" data-x="232" data-y="8" data-width="384" data-height="54"><rect x="232" y="8" width="384" height="54" rx="9" fill="#ffffff" stroke="#d3ccdf" stroke-width="1.2"/><text x="424" y="40" font-size="15" font-weight="500" text-anchor="middle" fill="#302c3f"><tspan x="424" dy="0">Client controls: plan, diff, review</tspan></text></g><g class="overview-node" data-x="8" data-y="71" data-width="180" data-height="54"><rect x="8" y="71" width="180" height="54" rx="9" fill="#f5f1fc" stroke="#a68dcf" stroke-width="1.2"/><text x="98" y="103" font-size="15" font-weight="600" text-anchor="middle" fill="#302c3f"><tspan x="98" dy="0">Terminal</tspan></text></g><path d="M188,98 L230,98" fill="none" stroke="#8a7ba4" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><g class="overview-node" data-x="232" data-y="71" data-width="384" data-height="54"><rect x="232" y="71" width="384" height="54" rx="9" fill="#ffffff" stroke="#d3ccdf" stroke-width="1.2"/><text x="424" y="103" font-size="15" font-weight="500" text-anchor="middle" fill="#302c3f"><tspan x="424" dy="0">Run the documented test command</tspan></text></g><text x="312" y="174" font-size="14" font-weight="400" text-anchor="middle" fill="#5e586f"><tspan x="312" dy="0">A diff shows edits. Tests check behavior.</tspan></text></svg>
