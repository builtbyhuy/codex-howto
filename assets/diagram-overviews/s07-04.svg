<svg xmlns="http://www.w3.org/2000/svg" width="624" height="200" viewBox="0 0 624 200" role="img" aria-labelledby="title-s07-04 desc-s07-04" font-family="Segoe UI, Arial, sans-serif"><title id="title-s07-04">A catalog points to packages without proving their setup</title><desc id="desc-s07-04">A marketplace source supplies catalog entries. Each entry identifies a package location and policy. The client chooses an entry, then installation, authentication, hook trust, and behavior require their own applicable checks.</desc><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#8a7ba4" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="624" height="200" fill="#ffffff"/><path d="M139,69 L165,69" fill="none" stroke="#8a7ba4" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M298,69 L324,69" fill="none" stroke="#8a7ba4" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M457,69 L483,69" fill="none" stroke="#8a7ba4" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><g class="overview-node" data-x="8" data-y="32" data-width="131" data-height="74"><rect x="8" y="32" width="131" height="74" rx="9" fill="#f5f1fc" stroke="#a68dcf" stroke-width="1.2"/><text x="73.5" y="63.5" font-size="15" font-weight="600" text-anchor="middle" fill="#302c3f"><tspan x="73.5" dy="0">Inspect catalog</tspan><tspan x="73.5" dy="21">entry</tspan></text></g><g class="overview-node" data-x="167" data-y="32" data-width="131" data-height="74"><rect x="167" y="32" width="131" height="74" rx="9" fill="#ffffff" stroke="#d3ccdf" stroke-width="1.2"/><text x="232.5" y="63.5" font-size="15" font-weight="500" text-anchor="middle" fill="#302c3f"><tspan x="232.5" dy="0">Choose package</tspan><tspan x="232.5" dy="21">source</tspan></text></g><g class="overview-node" data-x="326" data-y="32" data-width="131" data-height="74"><rect x="326" y="32" width="131" height="74" rx="9" fill="#ffffff" stroke="#d3ccdf" stroke-width="1.2"/><text x="391.5" y="63.5" font-size="15" font-weight="500" text-anchor="middle" fill="#302c3f"><tspan x="391.5" dy="0">Complete</tspan><tspan x="391.5" dy="21">required setup</tspan></text></g><g class="overview-node" data-x="485" data-y="32" data-width="131" data-height="74"><rect x="485" y="32" width="131" height="74" rx="9" fill="#ffffff" stroke="#d3ccdf" stroke-width="1.2"/><text x="550.5" y="63.5" font-size="15" font-weight="500" text-anchor="middle" fill="#302c3f"><tspan x="550.5" dy="0">Verify actual</tspan><tspan x="550.5" dy="21">behavior</tspan></text></g><text x="312" y="153" font-size="14" font-weight="400" text-anchor="middle" fill="#5e586f"><tspan x="312" dy="0">Catalog discovery does not prove installation or access.</tspan></text></svg>
