<svg xmlns="http://www.w3.org/2000/svg" width="624" height="236" viewBox="0 0 624 236" role="img" aria-labelledby="title-s08-02 desc-s08-02" font-family="Segoe UI, Arial, sans-serif"><title id="title-s08-02">Inspect both the change and its baseline</title><desc id="desc-s08-02">A working-tree diff shows current edits. The baseline establishes the desired earlier content. Compare both, preserve unrelated work, and choose a named-file or targeted correction.</desc><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#8a7ba4" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="624" height="236" fill="#ffffff"/><g class="overview-node" data-x="8" data-y="8" data-width="290" data-height="66"><rect x="8" y="8" width="290" height="66" rx="9" fill="#ffffff" stroke="#d3ccdf" stroke-width="1.2"/><text x="153" y="46" font-size="15" font-weight="500" text-anchor="middle" fill="#302c3f"><tspan x="153" dy="0">Current file + diff</tspan></text></g><path d="M153,74 L153,100 L312,100" fill="none" stroke="#8a7ba4" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><g class="overview-node" data-x="326" data-y="8" data-width="290" data-height="66"><rect x="326" y="8" width="290" height="66" rx="9" fill="#ffffff" stroke="#d3ccdf" stroke-width="1.2"/><text x="471" y="46" font-size="15" font-weight="500" text-anchor="middle" fill="#302c3f"><tspan x="471" dy="0">Verified baseline</tspan></text></g><path d="M471,74 L471,100 L312,100" fill="none" stroke="#8a7ba4" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M312,100 L312,128" fill="none" stroke="#8a7ba4" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><g class="overview-node" data-x="126" data-y="130" data-width="372" data-height="58"><rect x="126" y="130" width="372" height="58" rx="9" fill="#f5f1fc" stroke="#a68dcf" stroke-width="1.2"/><text x="312" y="164" font-size="15" font-weight="600" text-anchor="middle" fill="#302c3f"><tspan x="312" dy="0">Targeted correction; preserve useful work</tspan></text></g><text x="312" y="219" font-size="14" font-weight="400" text-anchor="middle" fill="#5e586f"><tspan x="312" dy="0">Review the final diff before accepting the correction.</tspan></text></svg>
