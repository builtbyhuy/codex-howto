<svg xmlns="http://www.w3.org/2000/svg" width="624" height="304" viewBox="0 0 624 304" role="img" aria-labelledby="title-s03-02 desc-s03-02" font-family="Segoe UI, Arial, sans-serif"><title id="title-s03-02">Progressive disclosure loads detail as the task needs it</title><desc id="desc-s03-02">Metadata supports discovery. The selected SKILL.md provides the procedure. Supporting references or scripts are consulted only when needed. This is conditional discovery, not a requirement to load every file sequentially.</desc><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#8a7ba4" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="624" height="304" fill="#ffffff"/><path d="M312,62 L312,80 L140,80 L140,106" fill="none" stroke="#8a7ba4" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M312,80 L484,80 L484,106" fill="none" stroke="#8a7ba4" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="162" y="96" font-size="14" font-weight="500" text-anchor="middle" fill="#5e586f"><tspan x="162" dy="0">Yes</tspan></text><text x="506" y="96" font-size="14" font-weight="500" text-anchor="middle" fill="#5e586f"><tspan x="506" dy="0">No</tspan></text><path d="M140,172 L140,191 L312,191 L312,205" fill="none" stroke="#8a7ba4" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><g class="overview-node" data-x="186" data-y="8" data-width="252" data-height="54"><path d="M200,8 H424 L438,35 L424,62 H200 L186,35 Z" fill="#f5f1fc" stroke="#a68dcf" stroke-width="1.2"/><text x="312" y="40" font-size="15" font-weight="600" text-anchor="middle" fill="#302c3f"><tspan x="312" dy="0">Relevant skill selected?</tspan></text></g><g class="overview-node" data-x="8" data-y="108" data-width="264" data-height="64"><rect x="8" y="108" width="264" height="64" rx="9" fill="#ffffff" stroke="#d3ccdf" stroke-width="1.2"/><text x="140" y="145" font-size="15" font-weight="500" text-anchor="middle" fill="#302c3f"><tspan x="140" dy="0">Read its SKILL.md</tspan></text></g><g class="overview-node" data-x="352" data-y="108" data-width="264" data-height="64"><rect x="352" y="108" width="264" height="64" rx="9" fill="#ffffff" stroke="#d3ccdf" stroke-width="1.2"/><text x="484" y="145" font-size="15" font-weight="500" text-anchor="middle" fill="#302c3f"><tspan x="484" dy="0">Continue without it</tspan></text></g><g class="overview-node" data-x="112" data-y="207" data-width="400" data-height="52"><rect x="112" y="207" width="400" height="52" rx="9" fill="#ffffff" stroke="#d3ccdf" stroke-width="1.2"/><text x="312" y="238" font-size="15" font-weight="500" text-anchor="middle" fill="#302c3f"><tspan x="312" dy="0">Read support only if the task needs it</tspan></text></g><text x="312" y="290" font-size="14" font-weight="400" text-anchor="middle" fill="#5e586f"><tspan x="312" dy="0">Discovery is conditional; it is not “load every file.”</tspan></text></svg>
