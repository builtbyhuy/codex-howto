<svg xmlns="http://www.w3.org/2000/svg" width="288" height="316" viewBox="0 0 288 316" role="img" aria-labelledby="title-s04-01-mobile desc-s04-01-mobile" font-family="Segoe UI, Arial, sans-serif"><title id="title-s04-01-mobile">Two independent work packages meet at one interface</title><desc id="desc-s04-01-mobile">The parent supplies the frozen normalized-task interface. Owner A fixes status normalization while owner B fixes aggregation against that interface. Their code and evidence meet at integration, where the four learner candidate tests check the combined result.</desc><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#8a7ba4" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="288" height="316" fill="#ffffff"/><g class="overview-node" data-x="12" data-y="8" data-width="264" data-height="52"><rect x="12" y="8" width="264" height="52" rx="9" fill="#f5f1fc" stroke="#a68dcf" stroke-width="1.2"/><text x="144" y="28.5" font-size="15" font-weight="600" text-anchor="middle" fill="#302c3f"><tspan x="144" dy="0">Frozen normalized-task</tspan><tspan x="144" dy="21">interface</tspan></text></g><path d="M144,60 L144,80 L69,80 L69,98" fill="none" stroke="#8a7ba4" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M144,80 L219,80 L219,98" fill="none" stroke="#8a7ba4" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M69,164 L69,173 L144,173 L144,188" fill="none" stroke="#8a7ba4" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M219,164 L219,173 L144,173" fill="none" stroke="#8a7ba4" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><g class="overview-node" data-x="4" data-y="100" data-width="130" data-height="64"><rect x="4" y="100" width="130" height="64" rx="9" fill="#ffffff" stroke="#d3ccdf" stroke-width="1.2"/><text x="69" y="126.5" font-size="15" font-weight="500" text-anchor="middle" fill="#302c3f"><tspan x="69" dy="0">A: normalize</tspan><tspan x="69" dy="21">status</tspan></text></g><g class="overview-node" data-x="154" data-y="100" data-width="130" data-height="64"><rect x="154" y="100" width="130" height="64" rx="9" fill="#ffffff" stroke="#d3ccdf" stroke-width="1.2"/><text x="219" y="126.5" font-size="15" font-weight="500" text-anchor="middle" fill="#302c3f"><tspan x="219" dy="0">B: aggregate</tspan><tspan x="219" dy="21">report</tspan></text></g><g class="overview-node" data-x="12" data-y="190" data-width="264" data-height="58"><rect x="12" y="190" width="264" height="58" rx="9" fill="#f5f1fc" stroke="#a68dcf" stroke-width="1.2"/><text x="144" y="213.5" font-size="15" font-weight="600" text-anchor="middle" fill="#302c3f"><tspan x="144" dy="0">Integrate; run four candidate</tspan><tspan x="144" dy="21">checks</tspan></text></g><text x="144" y="276" font-size="14" font-weight="400" text-anchor="middle" fill="#5e586f"><tspan x="144" dy="0">Separate code ownership; one checked</tspan><tspan x="144" dy="20">combined outcome.</tspan></text></svg>
